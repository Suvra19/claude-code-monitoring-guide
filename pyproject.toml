[project]
name = "claude-code-proxy"
version = "0.1.0"
description = "Logging proxy for Claude Code with OpenTelemetry instrumentation"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
